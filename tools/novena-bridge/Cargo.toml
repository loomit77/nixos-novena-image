[package]
name = "novena-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sha1 = "0.10"
sha2 = "=0.10.9"
serde_json = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
# Bereits transitiv gepinnt; direkter Zugriff ist für die HTTP/1-Vorparsergrenze nötig.
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
tokio = { version = "=1.54.1", features = ["rt", "net", "time", "io-util"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false }
